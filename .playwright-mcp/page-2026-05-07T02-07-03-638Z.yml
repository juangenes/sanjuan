      - paragraph [ref=e50]: "San Juan se celebra cada 24 de junio en honor a San Juan Bautista, y en Paraguay es mucho más que una fecha en el calendario: es el olor a leña, los pies descalzos sobre las brasas, las botellas que vuelan alto en el carrera vosa, y la familia entera afuera hasta la tardecita. Es cultura viva, y este año los padres del Sexto Grado del Colegio Torrefuerte la traemos de vuelta para nuestros chicos."
