name: Deploy to Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      DROPLET_PORT: ${{ secrets.DROPLET_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          # Solo escaneamos la clave ed25519 (la que tiene el servidor): una unica
          # conexion en vez de las ~5 que abre keyscan por defecto. Asi no disparamos
          # el jail sshd de fail2ban, que antes baneaba la IP del runner a mitad del deploy.
          ssh-keyscan -t ed25519 -p "${DROPLET_PORT:-22}" -H "$DROPLET_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Sin ControlMaster: la multiplexion era lo que dejaba colgado el rsync cuando
          # la conexion se caia. Keepalives + ConnectTimeout para fallar rapido, no colgar.
          cat >> ~/.ssh/config <<EOF
          Host droplet
            HostName $DROPLET_HOST
            User $DROPLET_USER
            Port ${DROPLET_PORT:-22}
            BatchMode yes
            ConnectTimeout 30
            ServerAliveInterval 15
            ServerAliveCountMax 4
          EOF

      - name: Sync backend source
        run: |
          for intento in 1 2 3; do
            if rsync -az --delete --timeout=120 \
                --exclude 'node_modules' \
                --exclude '.env' \
                --exclude 'uploads' \
                backend/ \
                "droplet:/var/www/sanjuan/backend/"; then
              exit 0
            fi
            echo "rsync backend fallo (intento $intento/3), reintentando en 15s..."
            sleep 15
          done
          echo "rsync backend fallo tras 3 intentos" >&2
          exit 1

      - name: Sync frontend build output
        run: |
          for intento in 1 2 3; do
            if rsync -az --delete --timeout=120 \
                frontend/dist/ \
                "droplet:/var/www/sanjuan/frontend/dist/"; then
              exit 0
            fi
            echo "rsync frontend fallo (intento $intento/3), reintentando en 15s..."
            sleep 15
          done
          echo "rsync frontend fallo tras 3 intentos" >&2
          exit 1

      - name: Install backend deps and restart API
        run: |
          ssh droplet 'bash -se' << 'EOF'
            set -e
            cd /var/www/sanjuan/backend
            npm ci --omit=dev
            pm2 startOrRestart ecosystem.config.js --env production
          EOF
