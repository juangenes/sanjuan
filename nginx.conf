server {
    listen 80;
    server_name sanjuandicequesi.com www.sanjuandicequesi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sanjuandicequesi.com www.sanjuandicequesi.com;

    ssl_certificate     /etc/letsencrypt/live/sanjuandicequesi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanjuandicequesi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/sanjuan/frontend/dist;
    index index.html;

    # React SPA — todas las rutas al index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El index.html nunca se cachea: siempre apunta a los bundles (con hash)
    # mas recientes, asi ningun cliente queda pegado a un build viejo.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # API backend
    location /api/ {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_cache_bypass $http_upgrade;
    }

    # Imágenes de productos (estáticas, build)
    location /img/ {
        alias /var/www/sanjuan/frontend/dist/img/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Imágenes subidas desde el panel admin
    location /uploads/ {
        alias /var/www/sanjuan/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Subida de archivos (admin)
    client_max_body_size 8M;
}
